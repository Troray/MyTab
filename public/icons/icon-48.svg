<svg width="512" height="512" viewBox="0 0 512 512" fill="none"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <!-- 主背景渐变 -->
  <linearGradient id="bg" x1="60" y1="20" x2="470" y2="500">
    <stop stop-color="#9FB7FF"/>
    <stop offset="0.45" stop-color="#5156F6"/>
    <stop offset="1" stop-color="#B05CFF"/>
  </linearGradient>

  <!-- 玻璃渐变 -->
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="white" stop-opacity="0.42"/>
    <stop offset="1" stop-color="white" stop-opacity="0.18"/>
  </linearGradient>

  <!-- 高光 -->
  <linearGradient id="shine">
    <stop stop-color="white" stop-opacity="0.7"/>
    <stop offset="1" stop-color="white" stop-opacity="0"/>
  </linearGradient>

  <!-- 彩色点 -->
  <linearGradient id="blue">
    <stop stop-color="#20B8FF"/>
    <stop offset="1" stop-color="#0088DD"/>
  </linearGradient>

  <linearGradient id="pink">
    <stop stop-color="#FF3B9D"/>
    <stop offset="1" stop-color="#F00068"/>
  </linearGradient>

  <linearGradient id="orange">
    <stop stop-color="#FFB000"/>
    <stop offset="1" stop-color="#FF8500"/>
  </linearGradient>

  <linearGradient id="green">
    <stop stop-color="#21C98B"/>
    <stop offset="1" stop-color="#00A86B"/>
  </linearGradient>

  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="20"/>
  </filter>

  <clipPath id="clip">
    <rect x="0" y="0" width="512" height="512" rx="90"/>
  </clipPath>
</defs>


<!-- App 背景 -->
<rect width="512" height="512" rx="90" fill="url(#bg)"/>


<!-- 背景玻璃光斑 -->
<g clip-path="url(#clip)">
  <ellipse cx="110" cy="80"
           rx="180" ry="150"
           fill="white"
           opacity="0.16"
           filter="url(#soft)"/>

  <ellipse cx="420" cy="420"
           rx="180" ry="150"
           fill="#D58CFF"
           opacity="0.25"
           filter="url(#soft)"/>
</g>


<!-- 搜索栏 -->
<rect x="52" y="35"
      width="408"
      height="105"
      rx="52"
      fill="url(#glass)"
      stroke="white"
      stroke-opacity="0.45"
      stroke-width="4"/>

<!-- 搜索图标 -->
<circle cx="145" cy="83"
        r="28"
        stroke="white"
        stroke-width="12"/>

<line x1="166" y1="105"
      x2="190" y2="129"
      stroke="white"
      stroke-width="12"
      stroke-linecap="round"/>

<!-- 搜索横线 -->
<rect x="225" y="71"
      width="150"
      height="24"
      rx="12"
      fill="white"/>


<!-- 卡片函数视觉 -->

<!-- 左上 -->
<rect x="60" y="165"
      width="180"
      height="145"
      rx="35"
      fill="url(#glass)"
      stroke="white"
      stroke-opacity="0.4"
      stroke-width="4"/>

<circle cx="150" cy="215"
        r="38"
        fill="url(#blue)"/>

<rect x="95" y="260"
      width="110"
      height="15"
      rx="8"
      fill="white"
      opacity="0.9"/>


<!-- 右上 -->
<rect x="272" y="165"
      width="180"
      height="145"
      rx="35"
      fill="url(#glass)"
      stroke="white"
      stroke-opacity="0.4"
      stroke-width="4"/>

<circle cx="362" cy="215"
        r="38"
        fill="url(#pink)"/>

<rect x="307" y="260"
      width="110"
      height="15"
      rx="8"
      fill="white"
      opacity="0.9"/>


<!-- 左下 -->
<rect x="60" y="330"
      width="180"
      height="145"
      rx="35"
      fill="url(#glass)"
      stroke="white"
      stroke-opacity="0.4"
      stroke-width="4"/>

<circle cx="150" cy="380"
        r="38"
        fill="url(#orange)"/>

<rect x="95" y="425"
      width="110"
      height="15"
      rx="8"
      fill="white"
      opacity="0.9"/>


<!-- 右下 -->
<rect x="272" y="330"
      width="180"
      height="145"
      rx="35"
      fill="url(#glass)"
      stroke="white"
      stroke-opacity="0.4"
      stroke-width="4"/>

<circle cx="362" cy="380"
        r="38"
        fill="url(#green)"/>

<rect x="307" y="425"
      width="110"
      height="15"
      rx="8"
      fill="white"
      opacity="0.9"/>


<!-- 顶部玻璃反光 -->
<path d="M80 20C170 0 300 10 420 50"
      stroke="white"
      stroke-opacity="0.18"
      stroke-width="30"
      stroke-linecap="round"/>


<!-- 外框高光 -->
<rect x="2"
      y="2"
      width="508"
      height="508"
      rx="88"
      stroke="white"
      stroke-opacity="0.55"
      stroke-width="5"/>

</svg>