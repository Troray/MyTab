<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
    
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#outerShadow)" />

  <!-- Inner Ambient Glow Highlights -->
  <circle cx="140" cy="140" r="120" fill="#ffffff" opacity="0.15" />
  <circle cx="380" cy="380" r="100" fill="#f43f5e" opacity="0.25" />

  <!-- Outer Glass Bevel Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Main Glass Dashboard Card (MyTab Representation) -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Top Search Bar Mock inside the Card -->
  <rect x="136" y="136" width="240" height="36" rx="18" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
  <circle cx="160" cy="154" r="7" fill="none" stroke="#ffffff" stroke-width="2.5" />
  <line x1="165" y1="159" x2="173" y2="167" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <rect x="186" y="151" width="80" height="6" rx="3" fill="rgba(255, 255, 255, 0.7)" />

  <!-- 4 Frosted Grid Tiles (Icons / Apps) -->
  <!-- Tile 1 (Top Left - Cyan/Blue) -->
  <rect x="136" y="200" width="104" height="84" rx="20" fill="rgba(255, 255, 255, 0.25)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" filter="url(#tileShadow)" />
  <circle cx="188" cy="234" r="15" fill="url(#accentGrad)" />
  <rect x="160" y="260" width="56" height="6" rx="3" fill="rgba(255, 255, 255, 0.85)" />

  <!-- Tile 2 (Top Right - Pink/Fuchsia) -->
  <rect x="272" y="200" width="104" height="84" rx="20" fill="rgba(255, 255, 255, 0.25)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" filter="url(#tileShadow)" />
  <circle cx="324" cy="234" r="15" fill="#ec4899" />
  <rect x="296" y="260" width="56" height="6" rx="3" fill="rgba(255, 255, 255, 0.85)" />

  <!-- Tile 3 (Bottom Left - Amber/Orange) -->
  <rect x="136" y="308" width="104" height="84" rx="20" fill="rgba(255, 255, 255, 0.25)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" filter="url(#tileShadow)" />
  <circle cx="188" cy="342" r="15" fill="#f59e0b" />
  <rect x="160" y="368" width="56" height="6" rx="3" fill="rgba(255, 255, 255, 0.85)" />

  <!-- Tile 4 (Bottom Right - Emerald/Green) -->
  <rect x="272" y="308" width="104" height="84" rx="20" fill="rgba(255, 255, 255, 0.25)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" filter="url(#tileShadow)" />
  <circle cx="324" cy="342" r="15" fill="#10b981" />
  <rect x="296" y="368" width="56" height="6" rx="3" fill="rgba(255, 255, 255, 0.85)" />
</svg>
