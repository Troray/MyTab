name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extensions
        run: npm run build

      - name: Package zip and source files
        run: npm run package

      - name: Prepare standard zip files
        run: |
          cp dist/mytab-chrome.zip dist/chrome.zip
          cp dist/mytab-firefox.zip dist/firefox.zip

      - name: Build Chrome .crx
        env:
          CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_KEY" ]; then
            echo "$CRX_KEY" > crx-key.pem
            npx -y crx pack dist/chrome -p crx-key.pem -o dist/chrome.crx
            rm -f crx-key.pem
            echo "✅ chrome.crx generated successfully."
          else
            echo "⚠️ CRX_PRIVATE_KEY is not set, skipping .crx generation."
          fi

      - name: Build Firefox .xpi
        run: |
          cp dist/mytab-firefox.zip dist/firefox.xpi
          echo "✅ firefox.xpi generated successfully."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MyTab Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          make_latest: "true"
          body: |
            ### 📖 如何安装

            - **Chrome 浏览器用户**：
              1. 请下载 Release 里的 `chrome.zip` 并解压到一个固定文件夹。
              2. 打开 Chrome 地址栏输入：`chrome://extensions/`。
              3. 开启右上角 **「开发者模式」(Developer mode)** 开关。
              4. 点击左上角 **「加载已解压的扩展程序」(Load unpacked)**，选择刚刚解压的文件夹即可。

            - **其他 Chromium 浏览器**：
              - 可以直接下载并安装 `chrome.crx`。
              - `chrome.crx` 支持在 **Brave / Vivaldi / 360 极速浏览器 / Cent Browser / 搜狗高速** 等浏览器中直接拖拽安装（非常适合非 Chrome 的国内/第三方 Chromium 用户）。

            - **Microsoft Edge**：
              - 直接到微软官方 Edge 扩展中心进行安装：[Edge 扩展中心](https://microsoftedge.microsoft.com/addons/detail/bchchngjdocafdpnnoiolnbfdnkngfjn)

            - **Firefox 浏览器**：
              - **官方商店安装（推荐）**：前往 [Firefox 附加组件中心](https://addons.mozilla.org/zh-CN/firefox/addon/mytab-%E6%9E%81%E7%AE%80%E6%96%B0%E6%A0%87%E7%AD%BE%E9%A1%B5/) 一键安装。
              - **离线安装**：点击下载下方附件中的 `firefox.xpi` 安装。
          files: |
            dist/chrome.zip
            dist/chrome.crx
            dist/firefox.zip
            dist/firefox.xpi

      - name: Publish to Microsoft Edge Add-ons
        if: env.EDGE_PRODUCT_ID != '' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != '' && env.EDGE_ACCESS_TOKEN_URL != ''
        uses: wocal/edge-addon-action@v1
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCTID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENTID }}
          EDGE_API_KEY: ${{ secrets.EDGE_KEY }}
          EDGE_ACCESS_TOKEN_URL: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
        with:
          product-id: ${{ secrets.EDGE_PRODUCTID }}
          client-id: ${{ secrets.EDGE_CLIENTID }}
          api-key: ${{ secrets.EDGE_KEY }}
          access-token-url: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
          zip-path: dist/chrome.zip

      - name: Publish to Mozilla Firefox Add-ons (AMO)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        uses: wocal/firefox-addon-action@v1
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        with:
          guid: 'mytab@addon.local'
          xpi-path: dist/firefox.zip
          src-path: dist/mytab-source.zip
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}
