name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extensions
        run: npm run build

      - name: Package zip and source files
        run: npm run package

      - name: Prepare standard zip files
        run: |
          cp dist/mytab-chrome.zip dist/chrome.zip
          cp dist/mytab-firefox.zip dist/firefox.zip

      - name: Build Chrome .crx
        env:
          CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_KEY" ]; then
            echo "$CRX_KEY" > crx-key.pem
            npx -y crx pack dist/chrome -p crx-key.pem -o dist/chrome.crx
            rm -f crx-key.pem
            echo "✅ chrome.crx generated successfully."
          else
            echo "⚠️ CRX_PRIVATE_KEY is not set, skipping .crx generation."
          fi

      - name: Build Firefox .xpi
        run: |
          cp dist/mytab-firefox.zip dist/firefox.xpi
          echo "✅ firefox.xpi generated successfully."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MyTab Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/chrome.zip
            dist/chrome.crx
            dist/firefox.zip
            dist/firefox.xpi
